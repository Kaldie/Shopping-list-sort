# Local / home-server stack: Caddy (HTTPS) → app (Go API + Vue frontend).
#
#   cp .env.example .env    # optional: set GOOGLE_CLIENT_ID / SITE_ADDRESS
#   docker compose up -d --build
#   open https://localhost
services:
  app:
    build: .
    image: shopping-list-sort:latest
    restart: unless-stopped
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SECURE_COOKIES: "true"
    volumes:
      - app-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Keeps yourname.duckdns.org pointing at your current home IP.
  # Only runs with the profile:  docker compose --profile duckdns up -d
  duckdns:
    image: curlimages/curl:8.10.1
    profiles: [duckdns]
    restart: unless-stopped
    environment:
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:-}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
    # Every 5 minutes; empty ip= lets DuckDNS use the address the request comes from.
    # The URL (with token) is never printed, only DuckDNS's OK/KO answer.
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$${DUCKDNS_SUBDOMAIN}" ] || [ -z "$${DUCKDNS_TOKEN}" ]; then
          echo "set DUCKDNS_SUBDOMAIN and DUCKDNS_TOKEN in .env"; exit 1
        fi
        while true; do
          r=$$(curl -fsS "https://www.duckdns.org/update?domains=$${DUCKDNS_SUBDOMAIN}&token=$${DUCKDNS_TOKEN}&ip=" 2>&1)
          echo "$$(date -Iseconds) duckdns update: $${r:-no answer}"
          sleep 300
        done

volumes:
  app-data:
  caddy-data:
  caddy-config:
