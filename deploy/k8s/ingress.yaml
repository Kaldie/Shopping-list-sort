# Traefik ingress: HTTPS on the websecure entrypoint. Adjust the host, and
# pick ONE way to get a certificate:
#  - cert-manager: keep the cert-manager annotation and the tls.secretName.
#  - Traefik's own ACME resolver: remove the cert-manager annotation and the
#    secretName, and add  traefik.ingress.kubernetes.io/router.tls.certresolver: <resolver>
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [shop.example.nl]
      secretName: app-tls
  rules:
    - host: shop.example.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
