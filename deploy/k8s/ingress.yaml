# Traefik ingress: HTTPS on the websecure entrypoint. The wildcard cert for
# *.kaldie.duckdns.org comes from Traefik's duckdns resolver, see
# deploy/k8s-cluster/traefik-config.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: duckdns
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: kaldie.duckdns.org
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.kaldie.duckdns.org"
spec:
  ingressClassName: traefik
  rules:
    - host: shop.kaldie.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
