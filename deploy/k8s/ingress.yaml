# Traefik ingress: HTTPS on the websecure entrypoint. The wildcard cert for
# *.kaldie.duckdns.org is requested through Traefik's duckdns resolver, named in the annotations below. The resolver
# itself is cluster-wide and shared by every product on the machine: it lives in the homelab repo (traefik.yaml),
# not here, because k3s allows only one HelmChartConfig named "traefik".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: duckdns
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: kaldie.duckdns.org
    traefik.ingress.kubernetes.io/router.tls.domains.0.sans: "*.kaldie.duckdns.org"
spec:
  ingressClassName: traefik
  rules:
    - host: shop.kaldie.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  name: http
