# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shopping-list-sort
labels:
  - pairs:
      app.kubernetes.io/part-of: shopping-list-sort
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
configMapGenerator:
  - name: app-config
    literals:
      - GOOGLE_CLIENT_ID=207143647732-hjil6g7k342b13f8u7p0ke9c3c20l50n.apps.googleusercontent.com
      - SECURE_COOKIES=true
images:
  - name: shopping-list-sort
    newName: localhost:5000/shopping-list-sort # in-cluster registry, see deploy/registry (or ghcr.io/kaldie/shopping-list-sort)
    newTag: hl10 # bump on every image build: nodes cache tags
