apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  # Data lives in a single JSON file on a RWO volume: exactly one replica,
  # and stop the old pod before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shopping-list-sort
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shopping-list-sort
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: shopping-list-sort:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi } # tesseract on large photos needs headroom
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp # OCR writes uploads to a temp file
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: app-data
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
